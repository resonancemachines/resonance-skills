      NOTIFICATION:
        id_field: "notificationId"
        causal_scope: "PER_AGGREGATE_INSTANCE"
        celebrity_skew_risk: "LOW"
        default_salt_buckets: 1
        cdc_topic: "resonance.outbox.NOTIFICATION"

  ReliabilityAndSupport:
    bounded_context: "resonance-support"
    aggregates:
      INCIDENT_TICKET:
        id_field: "ticketId"
        causal_scope: "PER_AGGREGATE_INSTANCE"
        celebrity_skew_risk: "LOW"
        default_salt_buckets: 1
        cdc_topic: "resonance.outbox.INCIDENT_TICKET"
      DLQ_QUARANTINE:
        id_field: "quarantineId"
