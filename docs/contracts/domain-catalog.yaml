# ==============================================================================
# Resonance Platform — Domain Aggregate Root Catalog (SSOT)
# ==============================================================================
# Governed by: ADR-0011 (OpenMetadata Enterprise Domain Catalog & Partitioning)
# Synchronized with: deploy/openmetadata/domain-glossary-manifest.json
# Standard Format: {tenantId}:{aggregateType}:{aggregateId}[#{saltBucket}]
# ==============================================================================

version: "1.0"
glossary: "ResonanceDomainCatalog"

domains:
  StorageAndVFS:
    bounded_context: "resonance-vfs"
    aggregates:
      VFS_NODE:
        id_field: "nodeId"
        causal_scope: "PER_AGGREGATE_INSTANCE"
        celebrity_skew_risk: "LOW"
        default_salt_buckets: 1
        cdc_topic: "resonance.outbox.VFS_NODE"
      VFS_DOCUMENT:
        id_field: "documentId"
        causal_scope: "PER_AGGREGATE_INSTANCE"
        celebrity_skew_risk: "LOW"
        default_salt_buckets: 1
        cdc_topic: "resonance.outbox.VFS_DOCUMENT"
      DOCUMENT_METADATA:
        id_field: "metadataId"
        causal_scope: "PER_AGGREGATE_INSTANCE"
        celebrity_skew_risk: "LOW"
        default_salt_buckets: 1
        cdc_topic: "resonance.outbox.DOCUMENT_METADATA"
      DOCUMENT_CHUNK:
        id_field: "chunkId"
        causal_scope: "PER_AGGREGATE_INSTANCE"
        celebrity_skew_risk: "MEDIUM"
        default_salt_buckets: 4
        cdc_topic: "resonance.outbox.DOCUMENT_CHUNK"

  OperationalIngress:
    bounded_context: "resonance-action"
    aggregates:
      INTENT:
        id_field: "intentId"
        causal_scope: "PER_AGGREGATE_INSTANCE"
        celebrity_skew_risk: "LOW"
        default_salt_buckets: 1
        cdc_topic: "resonance.outbox.INTENT"
      DOWNLOAD_SESSION:
